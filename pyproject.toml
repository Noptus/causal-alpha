[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-alpha-rl"
version = "0.1.0"
description = "Causal RL experiments for robust alpha discovery under regime shifts."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "seaborn>=0.13",
  "torch>=2.4",
  "tqdm>=4.66",
  "hmmlearn>=0.3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[tool.setuptools]
packages = [
  "causal_alpha_rl",
  "causal_alpha_rl.algorithms",
  "causal_alpha_rl.algorithms.baselines",
  "causal_alpha_rl.algorithms.causal_rl",
  "causal_alpha_rl.data",
  "causal_alpha_rl.envs",
  "causal_alpha_rl.evaluation",
  "causal_alpha_rl.experiments",
  "causal_alpha_rl.paper",
  "causal_alpha_rl.scm",
  "causal_alpha_rl.tests",
  "causal_alpha_rl.utils",
  "experiments",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

